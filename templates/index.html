<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadQuotely</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        pastelPink: '#fbcfe8',
                        pastelGreen: '#a7f3d0',
                        pastelPurple: '#d8b4fe'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans p-4 md:p-8 min-h-screen">
    
    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10 mt-4">
            <h1 class="text-5xl font-bold text-pastelPink tracking-wider">ReadQuotely</h1>
            <p class="text-gray-400 mt-2 text-lg">Kişisel kitap ve alıntı evrenin.</p>
        </header>

        <!-- VERİ EKLEME FORMLARI -->
        <div class="grid md:grid-cols-2 gap-6 mb-12">
            <!-- Kitap Ekleme Formu -->
            <div class="bg-cardBg p-6 rounded-2xl border border-pastelPink/30 shadow-lg">
                <h3 class="text-xl font-semibold text-pastelPink mb-4">Yeni Kitap Ekle</h3>
                <form id="bookForm" class="flex flex-col gap-3">
                    <input type="text" id="b_title" placeholder="Kitap Adı" required class="bg-darkBg border border-slate-600 rounded p-2 text-white focus:border-pastelPink outline-none">
                    <input type="text" id="b_author" placeholder="Yazar" required class="bg-darkBg border border-slate-600 rounded p-2 text-white focus:border-pastelPink outline-none">
                    <div class="flex gap-3">
                        <input type="text" id="b_genre" placeholder="Tür (Örn: Roman)" class="bg-darkBg border border-slate-600 rounded p-2 text-white w-1/2 outline-none">
                        <input type="number" id="b_pages" placeholder="Sayfa Sayısı" class="bg-darkBg border border-slate-600 rounded p-2 text-white w-1/2 outline-none">
                    </div>
                    <button type="submit" class="mt-2 bg-pastelPink text-slate-900 font-bold py-2 rounded hover:bg-pink-300 transition-colors">Kitabı Kaydet</button>
                </form>
            </div>

            <!-- Alıntı Ekleme Formu -->
            <div class="bg-cardBg p-6 rounded-2xl border border-pastelGreen/30 shadow-lg">
                <h3 class="text-xl font-semibold text-pastelGreen mb-4">Alıntı Ekle</h3>
                <form id="quoteForm" class="flex flex-col gap-3">
                    <select id="q_bookId" required class="bg-darkBg border border-slate-600 rounded p-2 text-white outline-none">
                        <option value="">Kitap Seçin...</option>
                        <!-- Kitaplar buraya JS ile dolacak -->
                    </select>
                    <textarea id="q_text" placeholder="Alıntı metni..." required rows="2" class="bg-darkBg border border-slate-600 rounded p-2 text-white focus:border-pastelGreen outline-none"></textarea>
                    <div class="flex gap-3">
                        <input type="number" id="q_page" placeholder="Sayfa No" class="bg-darkBg border border-slate-600 rounded p-2 text-white w-1/3 outline-none">
                        <input type="text" id="q_note" placeholder="Kişisel Notun" class="bg-darkBg border border-slate-600 rounded p-2 text-white w-2/3 outline-none">
                    </div>
                    <button type="submit" class="mt-2 bg-pastelGreen text-slate-900 font-bold py-2 rounded hover:bg-green-300 transition-colors">Alıntıyı Ekle</button>
                </form>
            </div>
        </div>

        <!-- KİTAPLARIN LİSTELENDİĞİ ALAN -->
        <hr class="border-slate-700 mb-8">
        <h2 class="text-2xl font-bold text-white mb-6">Kitaplığım</h2>
        <div id="books-container" class="grid gap-8 md:grid-cols-2">
            <!-- Veriler JS ile yüklenecek -->
        </div>
    </div>

    <script>
        const USER_ID = 1; // Şimdilik varsayılan kullanıcımız

        // Sayfa yüklendiğinde verileri çek
        function loadData() {
            fetch('/api/books')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('books-container');
                    const select = document.getElementById('q_bookId');
                    
                    container.innerHTML = '';
                    select.innerHTML = '<option value="">Kitap Seçin...</option>';

                    if(data.length === 0) {
                        container.innerHTML = '<p class="text-gray-400">Henüz hiç kitap eklemedin.</p>';
                        return;
                    }

                    data.forEach(book => {
                        // Dropdown (Seçenek) menüsüne kitabı ekle
                        select.innerHTML += `<option value="${book.id}">${book.title}</option>`;

                        // Kitap kartını ve alıntıları oluştur
                        let quotesHtml = '';
                        book.quotes.forEach(quote => {
                            quotesHtml += `
                                <div class="mt-4 p-4 border-l-4 border-pastelGreen bg-slate-700/30 rounded-r-lg">
                                    <p class="italic text-pastelGreen text-lg">"${quote.text}"</p>
                                    <div class="flex justify-between items-center mt-3">
                                        <p class="text-xs text-gray-400">Sayfa: ${quote.page || '-'}</p>
                                        ${quote.note ? `<p class="text-xs font-semibold text-pastelPurple bg-pastelPurple/10 px-2 py-1 rounded">Not: ${quote.note}</p>` : ''}
                                    </div>
                                </div>
                            `;
                        });

                        container.innerHTML += `
                            <div class="bg-cardBg p-6 rounded-2xl shadow-xl border border-slate-700">
                                <h2 class="text-2xl font-bold text-white mb-1">${book.title}</h2>
                                <p class="text-pastelPink mb-4 font-medium">${book.author} <span class="text-sm text-gray-400 font-normal">(${book.genre})</span></p>
                                <hr class="border-slate-600 mb-4">
                                <div>${quotesHtml}</div>
                            </div>
                        `;
                    });
                });
        }

        // KİTAP EKLEME İŞLEMİ
        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini engelle
            
            const bookData = {
                user_id: USER_ID,
                title: document.getElementById('b_title').value,
                author: document.getElementById('b_author').value,
                genre: document.getElementById('b_genre').value,
                total_pages: parseInt(document.getElementById('b_pages').value) || 0
            };

            fetch('/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            }).then(() => {
                this.reset(); // Formu temizle
                loadData(); // Listeyi güncelle
            });
        });

        // ALINTI EKLEME İŞLEMİ
        document.getElementById('quoteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const quoteData = {
                user_id: USER_ID,
                book_id: parseInt(document.getElementById('q_bookId').value),
                quote_text: document.getElementById('q_text').value,
                page_number: parseInt(document.getElementById('q_page').value) || 0,
                personal_note: document.getElementById('q_note').value
            };

            fetch('/api/quotes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(quoteData)
            }).then(() => {
                this.reset();
                loadData();
            });
        });

        // İlk yükleme
        loadData();
    </script>
</body>
</html>
